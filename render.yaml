# One-click cloud deploy on Render (https://render.com): Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: habitflow
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: habitflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://localhost,capacitor://localhost
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:you@example.com
      - key: ALLOW_REGISTRATION
        value: "true"

databases:
  - name: habitflow-db
    plan: basic-256mb
    databaseName: habitflow
    user: habitflow
