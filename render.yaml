# Free cloud deploy on Render (https://render.com): Dashboard -> New -> Blueprint -> pick this repo.
# The database lives on Neon's free plan (https://neon.com): paste its direct connection string as DATABASE_URL.
# Free web services sleep after 15 min idle. To keep it awake, have an uptime pinger (e.g. cron-job.org)
# GET /api/health every 10 minutes: that endpoint never touches the database, and the server closes its
# database connections when idle, so Neon still scales to zero and stays inside its free compute hours.
services:
  - type: web
    name: habitflow
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://localhost,capacitor://localhost
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: ALLOW_REGISTRATION
        value: "true"
